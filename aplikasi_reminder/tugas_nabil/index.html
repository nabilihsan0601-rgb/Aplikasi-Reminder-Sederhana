<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengingat Deadline - Task Manager</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Aplikasi -->
    <header class="app-header">
      <div class="header-content">
        <div class="logo-area">
          <div class="logo-icon">⏰</div>
          <div>
            <h1>TaskDeadline</h1>
            <p class="subtitle">Kelola tugas dan pantau deadline tepat waktu</p>
          </div>
        </div>
        <div class="date-badge" id="currentDateBadge">
          <!-- Diisi via JavaScript -->
        </div>
      </div>
    </header>

    <!-- Ringkasan Statistik -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Tugas Aktif</span>
        <span class="stat-value" id="statActive">0</span>
      </div>
      <div class="stat-card stat-urgent">
        <span class="stat-label">Mendesak (&lt; 24 Jam)</span>
        <span class="stat-value" id="statUrgent">0</span>
      </div>
      <div class="stat-card stat-completed">
        <span class="stat-label">Selesai</span>
        <span class="stat-value" id="statCompleted">0</span>
      </div>
    </section>

    <!-- Form Tambah Tugas Baru -->
    <section class="card form-card">
      <h2 class="section-title">
        <span class="icon">➕</span> Tambah Tugas Baru
      </h2>
      <form id="taskForm" autocomplete="off">
        <div class="form-group">
          <label for="taskTitle">Judul Tugas <span class="required">*</span></label>
          <input 
            type="text" 
            id="taskTitle" 
            placeholder="Contoh: Menyusun Laporan Proyek Akhir" 
            required 
            maxlength="100"
          >
        </div>

        <div class="form-group">
          <label for="taskDesc">Deskripsi Singkat</label>
          <textarea 
            id="taskDesc" 
            rows="2" 
            placeholder="Tambahkan catatan singkat mengenai tugas ini..."
            maxlength="300"
          ></textarea>
        </div>

        <div class="form-row">
          <!-- DatePicker -->
          <div class="form-group flex-1">
            <label for="taskDate">Tanggal Deadline <span class="required">*</span></label>
            <input type="date" id="taskDate" required>
          </div>
          <!-- TimePicker -->
          <div class="form-group flex-1">
            <label for="taskTime">Waktu Deadline <span class="required">*</span></label>
            <input type="time" id="taskTime" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btnSubmit">
          <span>Simpan Tugas</span>
        </button>
      </form>
    </section>

    <!-- Tab Navigasi & Filter -->
    <div class="tabs-container">
      <div class="tabs">
        <button class="tab-btn active" data-tab="active" id="tabActive">
          Tugas Aktif <span class="badge" id="badgeActiveCount">0</span>
        </button>
        <button class="tab-btn" data-tab="completed" id="tabCompleted">
          Selesai <span class="badge" id="badgeCompletedCount">0</span>
        </button>
      </div>
      <div class="sort-info">
        ⚡ <span>Diurutkan otomatis: Deadline terdekat</span>
      </div>
    </div>

    <!-- Container Daftar Tugas -->
    <main class="tasks-container">
      <div id="taskList" class="task-list">
        <!-- Render dinamis kartu tugas via JavaScript -->
      </div>

      <!-- State Kosong (Empty State) -->
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">🎉</div>
        <h3 id="emptyTitle">Tidak ada tugas aktif</h3>
        <p id="emptyDesc">Semua pekerjaan sudah selesai atau belum ada tugas yang ditambahkan.</p>
      </div>
    </main>

    <!-- Toast Notifikasi Ringan -->
    <div id="toastNotification" class="toast hidden"></div>

    <!-- Bubble Chat Notification (< 1 Jam) -->
    <div id="urgentChatBubble" class="chat-bubble-container hidden">
      <div class="chat-avatar-wrapper">
        <div class="chat-avatar">⏰</div>
        <span class="chat-pulse-ring"></span>
      </div>
      <div class="chat-bubble-card">
        <div class="chat-bubble-header">
          <div class="chat-agent-info">
            <span class="chat-agent-name">Asisten Deadline</span>
            <span class="chat-badge-urgent">Mendesak!</span>
          </div>
          <button class="chat-close-btn" id="btnDismissChat" title="Tutup pesan">&times;</button>
        </div>
        <div class="chat-bubble-body" id="chatBubbleBody">
          <!-- Pesan teks dinamis via JavaScript -->
        </div>
        <div class="chat-bubble-footer">
          <button class="chat-action-btn" id="btnFocusUrgentTask">
            <span>Lihat Tugas</span> ➔
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="app.js"></script>
</body>
</html>
